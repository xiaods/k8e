name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      validation-ref:
        description: Git commit to validate
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.validation-ref || github.sha }}
          persist-credentials: false

      - name: Install mise tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: 2026.7.14

      - name: Check formatting
        run: mise run fmt-check

      - name: Validate workflows
        run: mise run ci-lint

  core-test:
    name: Core (${{ matrix.arch }}, ${{ matrix.optimize }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
            optimize: Debug
          - runner: ubuntu-24.04
            arch: x64
            optimize: ReleaseSafe
          - runner: ubuntu-24.04-arm
            arch: arm64
            optimize: Debug
          - runner: ubuntu-24.04-arm
            arch: arm64
            optimize: ReleaseSafe
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.validation-ref || github.sha }}
          persist-credentials: false

      - name: Install mise tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: 2026.7.14

      - name: Build
        run: zig build -Doptimize=${{ matrix.optimize }}

      - name: Test
        run: zig build test -Doptimize=${{ matrix.optimize }} --summary all

  package-consumer:
    name: Package consumer
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.validation-ref || github.sha }}
          persist-credentials: false

      - name: Install mise tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: 2026.7.14

      - name: Build raw package consumer
        run: mise run test-consumer
      - name: Install protobuf C++ tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            protobuf-compiler \
            libprotobuf-dev
      - name: Test generated C++ package consumer
        run: mise run test-consumer-cpp

  generated-c-bundle:
    name: Generated C bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.validation-ref || github.sha }}
          persist-credentials: false

      - name: Install pinned mise and Zig
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: 2026.7.14

      - name: Build reproducible bundle
        run: mise run check-transpiled-c

      - name: Upload verified bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: grpc-lite-transpiled-c
          path: .zig-cache/transpiled-c-dist/*
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  generated-c-consumer:
    name: Generated C bundle consumer — no Zig/no network
    needs: generated-c-bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.validation-ref || github.sha }}
          persist-credentials: false

      - name: Verify no-Zig container host
        run: |
          test -z "$(command -v zig || true)"
          docker version

      - name: Download verified bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: grpc-lite-transpiled-c
          path: bundle-dist

      - name: Consume bundle without Zig or network
        run: |
          test -z "$(command -v zig || true)"
          archives=(bundle-dist/*.tar.gz)
          test "${#archives[@]}" -eq 1
          tests/consumer/run_cmake_c.sh \
            "${archives[0]}" "${archives[0]}.sha256"

  tls-test:
    name: TLS
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.validation-ref || github.sha }}
          persist-credentials: false

      - name: Install mise tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: 2026.7.14

      - name: Run TLS tests
        run: mise run test-tls

      - name: Run ReleaseSafe TLS tests
        run: zig build test -Dtls=true -Doptimize=ReleaseSafe --summary all

      - name: Run TLS ThreadSanitizer tests
        run: mise run test-tls-tsan

      - name: Run TLS UndefinedBehaviorSanitizer tests
        run: UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 zig build test -Dtls=true -Dsanitize-thread=false -Dsanitize-c=true --summary all

  gperftools:
    name: Gperftools
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.validation-ref || github.sha }}
          persist-credentials: false

      - name: Install mise tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: 2026.7.14

      - name: Run gperftools tests
        run: mise run test-gperftools

  sanitizer:
    name: Sanitizer (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: TSan
            task: test-tsan
          - name: UBSan
            task: test-ubsan
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.validation-ref || github.sha }}
          persist-credentials: false

      - name: Install mise tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: 2026.7.14

      - name: Run sanitizer tests
        run: mise run ${{ matrix.task }}

  interop:
    name: Interop (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
            run_edge: true
          - runner: ubuntu-24.04-arm
            arch: arm64
            run_edge: true
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.validation-ref || github.sha }}
          persist-credentials: false

      - name: Install mise tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: 2026.7.14

      - name: Run grpcurl interop
        run: mise run interop

      - name: Install protobuf C++ tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            protobuf-compiler \
            libprotobuf-dev

      - name: Run official insecure interop
        run: mise run interop-official

      - name: Run official TLS interop
        if: matrix.arch == 'x64'
        run: mise run interop-tls

      - name: Run official HTTP/2 framing report
        run: mise run interop-http2

      - name: Run official HTTP/2 edge cases
        if: matrix.run_edge
        run: mise run interop-http2-edge

      - name: Upload interop reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: interop-reports-${{ matrix.arch }}
          path: .zig-cache/official/*.log
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7

  required:
    name: Required
    if: always()
    needs:
      - workflow-lint
      - core-test
      - generated-c-bundle
      - generated-c-consumer
      - gperftools
      - package-consumer
      - sanitizer
      - tls-test
      - interop
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify required jobs
        env:
          WORKFLOW_LINT_RESULT: ${{ needs.workflow-lint.result }}
          CORE_TEST_RESULT: ${{ needs.core-test.result }}
          GENERATED_C_BUNDLE_RESULT: ${{ needs.generated-c-bundle.result }}
          GENERATED_C_CONSUMER_RESULT: ${{ needs.generated-c-consumer.result }}
          GPERFTOOLS_RESULT: ${{ needs.gperftools.result }}
          PACKAGE_CONSUMER_RESULT: ${{ needs.package-consumer.result }}
          SANITIZER_RESULT: ${{ needs.sanitizer.result }}
          TLS_TEST_RESULT: ${{ needs.tls-test.result }}
          INTEROP_RESULT: ${{ needs.interop.result }}
        run: |
          test "$WORKFLOW_LINT_RESULT" = success
          test "$CORE_TEST_RESULT" = success
          test "$GENERATED_C_BUNDLE_RESULT" = success
          test "$GENERATED_C_CONSUMER_RESULT" = success
          test "$GPERFTOOLS_RESULT" = success
          test "$PACKAGE_CONSUMER_RESULT" = success
          test "$SANITIZER_RESULT" = success
          test "$TLS_TEST_RESULT" = success
          test "$INTEROP_RESULT" = success
