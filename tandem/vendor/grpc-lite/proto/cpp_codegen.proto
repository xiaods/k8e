syntax = "proto3";

package demo;

message EchoRequest {
  string message = 1;
}

message EchoReply {
  string message = 1;
}

service EchoService {
  rpc Echo(EchoRequest) returns (EchoReply);
  rpc ServerStream(EchoRequest) returns (stream EchoReply);
  rpc ClientStream(stream EchoRequest) returns (EchoReply);
  rpc BidiStream(stream EchoRequest) returns (stream EchoReply);
}

service CollisionService {
  rpc class(EchoRequest) returns (EchoReply);
  rpc class_(EchoRequest) returns (EchoReply);
  rpc Service(EchoRequest) returns (EchoReply);
  rpc Service_(EchoRequest) returns (EchoReply);
  rpc Register(EchoRequest) returns (EchoReply);
  rpc Register_(EchoRequest) returns (EchoReply);
  rpc EventService(EchoRequest) returns (EchoReply);
  rpc CreateEventService(EchoRequest) returns (EchoReply);
  rpc grpc_lite_registration_0_(EchoRequest) returns (EchoReply);
  rpc grpc_lite_registration_0__(EchoRequest) returns (EchoReply);
}
