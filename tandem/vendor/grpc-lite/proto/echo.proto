syntax = "proto3";

package demo;

message EchoRequest {
  string message = 1;
}

message EchoReply {
  string message = 1;
}

service EchoService {
  rpc Echo(EchoRequest) returns (EchoReply);
}

service StreamingEchoService {
  rpc ServerEcho(EchoRequest) returns (stream EchoReply);
  rpc ClientEcho(stream EchoRequest) returns (EchoReply);
  rpc Chat(stream EchoRequest) returns (stream EchoReply);
}
