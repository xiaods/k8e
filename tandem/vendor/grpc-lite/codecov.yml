coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
    patch:
      default:
        target: auto
        threshold: 1%

comment:
  layout: "condensed_header, diff, flags, components, condensed_files"
  require_changes: true

flags:
  core:
    paths:
      - src/
    carryforward: false
