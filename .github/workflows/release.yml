name: Release
on:
  release:
    types:
      - published

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── K8E server binary: linux/amd64 ───────────────────────────────────
  build-k8e:
    name: Build k8e
    runs-on: ubuntu-latest
    env:
      GOOS: linux
      GOARCH: amd64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true
          cache-dependency-path: go.sum
      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config build-essential libc6-dev zlib1g-dev libseccomp-dev
      - name: Generate resources
        run: |
          mkdir -p build/data build/static
          make deps
          zig build download
          make generate
      - name: Build k8e
        run: make k8e
      - name: Package CLI (data tarball)
        run: make package-cli
      - name: Package airgap image
        run: make package-airgap
      - name: Rename artifacts
        run: |
          mkdir -p release-artifacts
          cp dist/artifacts/k8e release-artifacts/k8e
          if [ -f dist/artifacts/k8e-airgap-images.tar.gz ]; then
            cp dist/artifacts/k8e-airgap-images.tar.gz release-artifacts/
          fi
      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: k8e
          path: release-artifacts/

  # ── K8E server binary: linux/arm64 ──────────────────────────────────
  build-k8e-arm64:
    name: Build k8e (arm64)
    runs-on: ubuntu-24.04-arm
    env:
      GOOS: linux
      GOARCH: arm64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true
          cache-dependency-path: go.sum
      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config build-essential libc6-dev zlib1g-dev libseccomp-dev
      - name: Generate resources
        run: |
          mkdir -p build/data build/static
          make deps
          zig build download
          make generate
      - name: Build k8e
        run: make k8e
      - name: Package CLI (data tarball)
        run: make package-cli
      - name: Rename artifact
        run: |
          mkdir -p release-artifacts
          cp dist/artifacts/k8e-arm64 release-artifacts/k8e
      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: k8e-arm64
          path: release-artifacts/k8e

  # ── Sandbox CLI: cross-platform binaries ──────────────────────────────
  build-sandbox-cli:
    name: Build sandbox-cli
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true
          cache-dependency-path: go.sum
      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Build sandbox-cli
        run: zig build sandboxcli
      - name: Upload linux-amd64
        uses: actions/upload-artifact@v5
        with:
          name: sandbox-cli-linux-amd64
          path: zig-out/bin/k8e-sandbox-cli-linux-amd64
      - name: Upload linux-arm64
        uses: actions/upload-artifact@v5
        with:
          name: sandbox-cli-linux-arm64
          path: zig-out/bin/k8e-sandbox-cli-linux-arm64
      - name: Upload darwin-amd64
        uses: actions/upload-artifact@v5
        with:
          name: sandbox-cli-darwin-amd64
          path: zig-out/bin/k8e-sandbox-cli-darwin-amd64
      - name: Upload darwin-arm64
        uses: actions/upload-artifact@v5
        with:
          name: sandbox-cli-darwin-arm64
          path: zig-out/bin/k8e-sandbox-cli-darwin-arm64
      - name: Upload windows-amd64
        uses: actions/upload-artifact@v5
        with:
          name: sandbox-cli-windows-amd64
          path: zig-out/bin/k8e-sandbox-cli-windows-amd64.exe

  # ── Sandbox container image ───────────────────────────────────────────
  build-sandbox-image:
    name: Build sandbox image
    runs-on: ubuntu-latest
    needs: build-k8e
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Build sandboxd binaries
        run: cd sandboxd && zig build sandboxd
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Sanitize tag
        id: tag
        run: echo "value=$(echo '${{ github.ref_name }}' | tr '+' '-')" >> $GITHUB_OUTPUT
      - name: Build and push sandbox image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: sandbox/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/xiaods/k8e-sandbox:${{ steps.tag.outputs.value }}
            ghcr.io/xiaods/k8e-sandbox:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Publish all artifacts on the GitHub Release ─────────────────────
  publish:
    name: Publish release assets
    runs-on: ubuntu-latest
    needs: [build-k8e, build-k8e-arm64, build-sandbox-cli]
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v6
        with:
          path: release-artifacts
          merge-multiple: true
      - name: Restore k8e arch assets
        run: |
          # Each arch job uploaded its k8e binary under its own artifact name
          # (k8e, k8e-arm64); download-artifact@v6 with merge-multiple: true
          # places them at <name>/k8e. install.sh on arm64 fetches k8e-arm64
          # by that exact asset name, so land both binaries with arch suffix.
          mv release-artifacts/k8e/k8e release-artifacts/k8e.bin
          mv release-artifacts/k8e-arm64/k8e release-artifacts/k8e-arm64.bin
          rm -rf release-artifacts/k8e release-artifacts/k8e-arm64
          mv release-artifacts/k8e.bin release-artifacts/k8e
          mv release-artifacts/k8e-arm64.bin release-artifacts/k8e-arm64
          # sha256sum-amd64.txt below needs the plain name; k8e-amd64 keeps
          # the release SHA256SUMS entries unambiguous across arches.
          cp release-artifacts/k8e release-artifacts/k8e-amd64
      - name: Generate unified SHA256SUMS
        run: |
          cd release-artifacts
          sha256sum * 2>/dev/null | sort > SHA256SUMS
          echo "--- SHA256SUMS ---"
          cat SHA256SUMS
      - name: Generate per-arch checksums for contrib/install.sh
        run: |
          cd release-artifacts
          # install.sh verifies downloads against sha256sum-<ARCH>.txt (grep
          # for its own binary name), so each arch file needs the suffix the
          # install script requests: the amd64 job publishes plain k8e; arm64
          # publishes k8e-arm64.
          sha256sum k8e-amd64 | awk '{print $1, $2}' > sha256sum-amd64.txt
          sed 's/k8e-amd64/k8e-arm64/' sha256sum-amd64.txt > sha256sum-arm64.txt
          sed -i 's/^k8e-amd64/k8e/' sha256sum-amd64.txt
      - name: List artifacts
        run: ls -la release-artifacts/
      - name: Upload to release
        uses: softprops/action-gh-release@v2.6.1
        with:
          files: |
            release-artifacts/k8e
            release-artifacts/k8e-arm64
            release-artifacts/k8e-airgap-images.tar.gz
            release-artifacts/k8e-sandbox-cli-linux-amd64
            release-artifacts/k8e-sandbox-cli-linux-arm64
            release-artifacts/k8e-sandbox-cli-darwin-amd64
            release-artifacts/k8e-sandbox-cli-darwin-arm64
            release-artifacts/k8e-sandbox-cli-windows-amd64.exe
            release-artifacts/SHA256SUMS
            release-artifacts/sha256sum-amd64.txt
            release-artifacts/sha256sum-arm64.txt
          fail_on_unmatched_files: false
