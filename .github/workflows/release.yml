name: Release
on:
  release:
    types:
      - published

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── K8E server binary: linux/amd64 ───────────────────────────────────
  build-k8e:
    name: Build k8e
    runs-on: ubuntu-latest
    env:
      GOOS: linux
      GOARCH: amd64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true
          cache-dependency-path: go.sum
      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config build-essential libc6-dev zlib1g-dev libseccomp-dev
      - name: Generate resources
        run: |
          mkdir -p build/data build/static
          make deps
          zig build download
          make generate
      - name: Build k8e
        run: make k8e
      - name: Package CLI (data tarball)
        run: make package-cli
      - name: Package airgap image
        run: make package-airgap
      - name: Rename artifacts
        run: |
          mkdir -p release-artifacts
          cp dist/artifacts/k8e release-artifacts/k8e
          if [ -f dist/artifacts/k8e-airgap-images.tar.gz ]; then
            cp dist/artifacts/k8e-airgap-images.tar.gz release-artifacts/
          fi
      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: k8e
          path: release-artifacts/

  # ── Sandbox CLI: cross-platform binaries ──────────────────────────────
  build-sandbox-cli:
    name: Build sandbox-cli (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: linux-amd64
            goos: linux
            goarch: amd64
          - target: linux-arm64
            goos: linux
            goarch: arm64
          - target: darwin-amd64
            goos: darwin
            goarch: amd64
          - target: darwin-arm64
            goos: darwin
            goarch: arm64
          - target: windows-amd64
            goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true
          cache-dependency-path: go.sum
      - name: Build sandbox-cli
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          EXT=""
          if [ "${{ matrix.goos }}" = "windows" ]; then EXT=".exe"; fi
          go build -ldflags="-s -w" -o "k8e-${{ matrix.target }}${EXT}" ./cmd/sandbox-cli/
      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: sandbox-cli-${{ matrix.target }}
          path: k8e-${{ matrix.target }}*

  # ── Sandbox container image ───────────────────────────────────────────
  build-sandbox-image:
    name: Build sandbox image
    runs-on: ubuntu-latest
    needs: build-k8e
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - name: Build sandboxd binaries
        run: cd sandboxd && zig build sandboxd
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}
      - name: Sanitize tag
        id: tag
        run: echo "value=$(echo '${{ github.ref_name }}' | tr '+' '-')" >> $GITHUB_OUTPUT
      - name: Build and push sandbox image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: sandbox/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/xiaods/k8e-sandbox:${{ steps.tag.outputs.value }}
            ghcr.io/xiaods/k8e-sandbox:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Publish all artifacts on the GitHub Release ─────────────────────
  publish:
    name: Publish release assets
    runs-on: ubuntu-latest
    needs: [build-k8e, build-sandbox-cli]
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v6
        with:
          path: release-artifacts
          merge-multiple: true
      - name: Generate unified SHA256SUMS
        run: |
          cd release-artifacts
          sha256sum * 2>/dev/null | sort > SHA256SUMS
          echo "--- SHA256SUMS ---"
          cat SHA256SUMS
      - name: List artifacts
        run: ls -la release-artifacts/
      - name: Upload to release
        uses: softprops/action-gh-release@v2.6.1
        with:
          files: |
            release-artifacts/k8e
            release-artifacts/k8e-airgap-images.tar.gz
            release-artifacts/k8e-linux-amd64
            release-artifacts/k8e-linux-arm64
            release-artifacts/k8e-darwin-amd64
            release-artifacts/k8e-darwin-arm64
            release-artifacts/k8e-windows-amd64.exe
            release-artifacts/SHA256SUMS
          fail_on_unmatched_files: false
