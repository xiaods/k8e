name: Build Test
on:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - main
      - dev

permissions:
  checks: write
  pull-requests: write
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build & Test (linux/amd64)
    runs-on: ubuntu-latest
    env:
      GOOS: linux
      GOARCH: amd64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true
          cache-dependency-path: go.sum
      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y \
          pkg-config build-essential libc6-dev zlib1g-dev libseccomp-dev
      - name: Generate resources
        run: |
          mkdir -p build/data build/static
          make deps
          zig build download
          make generate
      - name: Go vet
        run: go vet ./...
      - name: Go test
        id: gotest
        run: |
          go install github.com/jstemmer/go-junit-report/v2@latest
          CGO_ENABLED=1 GOLANG_PROTOBUF_REGISTRATION_CONFLICT=warn \
            go test -v ./... 2>&1 | go-junit-report -set-exit-code > report.xml
      - name: Zig test (sandboxd)
        run: cd sandboxd && zig build test --summary all
      - name: Publish Unit Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2.23.0
        if: always()
        with:
          files: "./report.xml"

  cross-compile:
    name: Cross-compile check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true
          cache-dependency-path: go.sum
      - name: Verify sandboxcli cross-compiles
        env:
          CGO_ENABLED: 0
        run: |
          echo "--- linux/amd64 ---"
          GOOS=linux   GOARCH=amd64   go build ./pkg/sandboxcli/... ./pkg/sandboxmcp/...
          echo "--- linux/arm64 ---"
          GOOS=linux   GOARCH=arm64   go build ./pkg/sandboxcli/... ./pkg/sandboxmcp/...
          echo "--- darwin/amd64 ---"
          GOOS=darwin  GOARCH=amd64   go build ./pkg/sandboxcli/... ./pkg/sandboxmcp/...
          echo "--- darwin/arm64 ---"
          GOOS=darwin  GOARCH=arm64   go build ./pkg/sandboxcli/... ./pkg/sandboxmcp/...
          echo "--- windows/amd64 ---"
          GOOS=windows GOARCH=amd64   go build ./pkg/sandboxcli/... ./pkg/sandboxmcp/...
          echo "--- sandbox-cli binary (linux/amd64) ---"
          GOOS=linux   GOARCH=amd64   go build -o /dev/null ./cmd/sandbox-cli/
          echo "All cross-compile targets OK"
