<svg xmlns="http://www.w3.org/2000/svg" width="169.3162" height="29.5" viewBox="0 0 169.3162 29.5" fill="none" role="img" aria-label="k8e sandbox">
  <!--
    k8e-sandbox logo - horizontal lockup. Background: transparent.

    Left : the k8e sandbox mark, an isometric box in the k8e palette
           (k-paper #e8eeeb lit face, k-signal amber #ffb000 top face,
            k-shade #8fa5a0 right face).
    Right: the "K8E" wordmark, vectorised from the approved artwork
           (k8e-chatgpt.png) with potrace, so the file carries real outlines
           rather than a raster image and needs no fonts.

           The wordmark is scaled to the same cap height as the mark, so the
           box and the letters share a baseline and a top line.

    Variants:
      k8e-sandbox-logo.svg        dark surfaces   K8E = k-paper #e8eeeb
      k8e-sandbox-logo-light.svg  light surfaces  K8E = k-ink   #2b3a36
  -->
