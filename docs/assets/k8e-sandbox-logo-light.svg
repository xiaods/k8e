<svg xmlns="http://www.w3.org/2000/svg" width="128.4662" height="29.5" viewBox="0 0 128.4662 29.5" fill="none" role="img" aria-label="k8e sandbox">
  <!--
    k8e-sandbox logo - horizontal lockup. Background: transparent.

    Left : the k8e sandbox mark, an isometric box in the k8e palette
           (k-paper #e8eeeb lit face, k-signal amber #ffb000 top face,
            k-shade #8fa5a0 right face).
    Right: "K8E", drawn in the e2b logotype's geometry so the wordmark and the
           mark read as one family. Every metric is the e2b one:

             cap height              29.5
             band / stroke width      8.4053
             hairline slit height     2.1416
             outer corner radius      5.4511
             hairline corner radius   0.7937
             letter box width        33.02
             letter gap               2.05

           Construction is the e2b "e2b" logotype's own: solid horizontal
           bands with hairline slits cut through them, wrapped in a big-radius
           rounded box. The "E" is that logotype's glyph verbatim; the "8"
           adds a pinched waist so it does not read as a B (or a theta); the
           "K" is the same band width with two straight arms.

           One typeface-free system, one colour, one spine width, one cap
           height, one baseline - the three letters differ only in how the
           bands are interrupted.

    Variant: light surfaces. On dark surfaces use k8e-sandbox-logo.svg,
    where K8E is k-paper #e8eeeb.
  -->
