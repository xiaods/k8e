# SonarCloud project configuration
sonar.projectKey=xiaods_k8e

# Exclude generated protobuf code, vendored upstream manifests and lock files
# (generated/mechanical — never counted for duplication or issue analysis).
#
# manifests/cert-manager.yaml is the unmodified upstream v1.21.2 release
# manifest and its SHA-256 is asserted against the upstream release asset, so
# its container specs cannot be patched to satisfy kubernetes:S6864/S6873/
# S6892/S6897 (missing memory/CPU/storage requests and limits) without forking
# the very bundle we ship verbatim. Upstream resource declarations are the
# cert-manager release's responsibility, not this repository's.
sonar.exclusions=pkg/sandboxmatrix/grpc/pb/**,pkg/apis/**,pkg/generated/**,pkg/deploy/zz_generated_bindata.go,manifests/cert-manager.yaml,**/package-lock.json,**/pnpm-lock.yaml

# dsh plugin tools follow the framework-mandated defineTool shape (each tool
# carries name/description/parameters/output/execute); the structural
# similarity is API boilerplate, not copy-paste duplication.
sonar.cpd.exclusions=plugins/deepseek-harness/packages/dsh-k8e-sandbox-tool/**,**/package-lock.json,**/pnpm-lock.yaml
