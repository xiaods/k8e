apiVersion: v1
kind: Namespace
metadata:
  name: sandbox-matrix
  labels:
    app.kubernetes.io/managed-by: k8e
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: sandboxmatrices.k8e.sh
spec:
  group: k8e.sh
  names:
    kind: SandboxMatrix
    listKind: SandboxMatrixList
    plural: sandboxmatrices
    singular: sandboxmatrix
  scope: Namespaced
  versions:
  - name: v1alpha1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              warmPoolSize: {type: integer, minimum: 0}
              runtimeClass: {type: string}
              sessionTTL: {type: integer, minimum: 0}
              defaultAllowedHosts:
                type: array
                items: {type: string}
              resourceLimits:
                type: object
                properties:
                  cpu: {type: string}
                  memory: {type: string}
              rateLimits:
                type: object
                properties:
                  writeBurst: {type: integer, minimum: 0}
                  writeRate: {type: number, minimum: 0}
                  readBurst: {type: integer, minimum: 0}
                  readRate: {type: number, minimum: 0}
          status:
            type: object
            properties:
              readyWarmCount: {type: integer}
              activeSessions: {type: integer}
              maxPods: {type: integer}
              totalPods: {type: integer}
              claimedFromWarm: {type: integer}
              coldStarts: {type: integer}
              avgClaimLatencyMs: {type: integer}
    subresources:
      status: {}
    additionalPrinterColumns:
    - name: WarmPool
      type: integer
      jsonPath: .spec.warmPoolSize
    - name: Runtime
      type: string
      jsonPath: .spec.runtimeClass
    - name: Active
      type: integer
      jsonPath: .status.activeSessions
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: sandboxsessions.k8e.sh
spec:
  group: k8e.sh
  names:
    kind: SandboxSession
    listKind: SandboxSessionList
    plural: sandboxsessions
    singular: sandboxsession
  scope: Namespaced
  versions:
  - name: v1alpha1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              tenantID: {type: string}
              allowedHosts:
                type: array
                items: {type: string}
              runtimeClass: {type: string}
              parentSessionID: {type: string}
              depth: {type: integer, minimum: 0}
              env:
                type: object
                additionalProperties: {type: string}
              secretRefs:
                type: array
                items:
                  type: object
                  properties:
                    secretName: {type: string}
                    key: {type: string}
                    envVar: {type: string}
          status:
            type: object
            properties:
              phase:
                type: string
                enum:
                - Warm
                - Active
                - Paused
                - Resetting
                - Terminating
                - BackgroundRunning
                - BackgroundCompleted
              podName: {type: string}
              podIP: {type: string}
              workspacePVC: {type: string}
              createdAt: {type: string, format: date-time}
              expiresAt: {type: string, format: date-time}
    subresources:
      status: {}
    additionalPrinterColumns:
    - name: Phase
      type: string
      jsonPath: .status.phase
    - name: Pod
      type: string
      jsonPath: .status.podName
    - name: Runtime
      type: string
      jsonPath: .spec.runtimeClass
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: sandboxwarmpools.k8e.sh
spec:
  group: k8e.sh
  names:
    kind: SandboxWarmPool
    listKind: SandboxWarmPoolList
    plural: sandboxwarmpools
    singular: sandboxwarmpool
  scope: Namespaced
  versions:
  - name: v1alpha1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              size: {type: integer, minimum: 0}
              runtimeClass: {type: string}
              minSize: {type: integer, minimum: 0}
              maxSize: {type: integer, minimum: 0}
              idleTTLSeconds: {type: integer, minimum: 0}
              templateRef:
                type: object
                properties:
                  name: {type: string}
          status:
            type: object
            properties:
              readyCount: {type: integer}
              pendingCount: {type: integer}
    subresources:
      status: {}
    additionalPrinterColumns:
    - name: Size
      type: integer
      jsonPath: .spec.size
    - name: Ready
      type: integer
      jsonPath: .status.readyCount
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: sandboxtemplates.k8e.sh
spec:
  group: k8e.sh
  names:
    kind: SandboxTemplate
    listKind: SandboxTemplateList
    plural: sandboxtemplates
    singular: sandboxtemplate
  scope: Namespaced
  versions:
  - name: v1alpha1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              runtimeClass: {type: string}
              image: {type: string}
              allowedHosts:
                type: array
                items: {type: string}
    additionalPrinterColumns:
    - name: Runtime
      type: string
      jsonPath: .spec.runtimeClass
    - name: Image
      type: string
      jsonPath: .spec.image
