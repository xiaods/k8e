apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: sandbox-warm-deny-all
  namespace: %{SANDBOX_NAMESPACE}%
spec:
  endpointSelector:
    matchLabels:
      sandbox.k8e.io/state: warm
  # A selected endpoint's default is deny-all in each direction, but a policy
  # with only egress rules leaves INGRESS unrestricted. Without this section
  # every warm pod's unauthenticated sandboxd (:2024) was reachable from any
  # pod in the cluster. Only the kubelet's TCP readiness/startup probe (which
  # Cilium attributes to the host entity) may connect.
  ingress:
  - fromEntities:
    - host
    toPorts:
    - ports:
      - port: "2024"
        protocol: TCP
  egress:
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: kube-system
        k8s:k8s-app: kube-dns
    toPorts:
    - ports:
      - port: "53"
        protocol: ANY
