# KIP-18 e2b ingress: Cilium Gateway API fronting the k8e sandbox surfaces.
#
# Final architecture (KIP-18): the sandbox namespace + e2b-server BOTH embed in the
# k8e-server host process (embedded e2b is on by default; --disable-e2b to turn off); the Cilium Gateway API is the ONLY
# external door for every sandbox port:
#
#   :80       e2b HTTP (control plane + envd + signed files) via HTTPRoute
#             -> headless e2b-server Service/EndpointSlice -> host :3676
#   :443      the same e2b HTTP surface over TLS, via its own HTTPRoute
#             (needs the optional sandbox-e2b TLS secret; the :80 routes are
#             separate objects, so a missing secret never takes :80 down)
#   :50051    sandbox gRPC (SandboxService) via TCPRoute (L4 passthrough)
#             -> headless sandbox-grpc-gateway Service/EndpointSlice -> host :50051
#
# The gRPC gateway speaks strong mTLS (client certs signed by the sandbox CA,
# verified by mTLSAuthInterceptor), so the Gateway must NOT terminate its TLS:
# the TCPRoute forwards the byte stream unchanged and existing client certs
# keep working. The e2b HTTP surface is plain HTTP/Connect, so HTTPRoutes with
# Gateway-terminated TLS (sandbox-e2b secret) are correct there.
#
# Requires:
#   - gateway-api-crds.yaml applied (Cilium Gateway API controller CRDs)
#   - gatewayAPI.enabled=true in manifests/cilium.yaml
#   - k8e server with the embedded e2b enabled (default; --disable-e2b to turn
#     off; e2b listens on 0.0.0.0:3676 inside the host; --e2b-listen to override)
#     and the sandbox gRPC gateway
#     enabled (0.0.0.0:50051)
#
# Both host services are bridged into the cluster via headless Services,
# because they run in the k8e-server host process, not as pods. The
# sandbox-grpc-gateway EndpointSlice is owned by the leader-gated
# sandboxmatrix controller (KIP-30 M3.1: one endpoint per server node's
# routable addresses, reconciled from live cluster state); the e2b-server
# slice is staged statically from --advertise-address (KIP-21: never
# loopback — Kubernetes does not allow loopback Endpoint addresses).
---

apiVersion: v1
kind: Service
metadata:
  name: sandbox-grpc-gateway
  namespace: %{SANDBOX_NAMESPACE}%
  labels:
    app.kubernetes.io/managed-by: k8e
spec:
  # The sandbox gRPC gateway runs in the k8e-server host process on :50051,
  # not as a pod. This headless Service + EndpointSlice makes it reachable from
  # cluster pods (e.g. the e2b-server Deployment) by the stable DNS name
  # sandbox-grpc-gateway.%{SANDBOX_NAMESPACE}%.svc. The EndpointSlice address points
  # at the host's advertise IP (--advertise-address, default node-ip).
  clusterIP: None
  ports:
  - name: grpc
    port: 50051
    protocol: TCP
# The sandbox-grpc-gateway EndpointSlice is NOT staged here (KIP-30 M3.1):
# the leader-gated sandboxmatrix controller owns it and writes one endpoint
# per server node's routable addresses, so HA membership follows the live
# cluster instead of a stage-time %{ADVERTISE_IP}%. The Service below is the
# stable name both the TCPRoute and in-cluster clients dial.
---
apiVersion: v1
kind: Service
metadata:
  name: e2b-server
  namespace: %{SANDBOX_NAMESPACE}%
  labels:
    app.kubernetes.io/managed-by: k8e
spec:
  # The E2B HTTP server runs embedded in the k8e-server host process
  # (embedded in k8e-server, on by default; --e2b-listen to override, default
  # 0.0.0.0:3676), not as a pod. This headless Service + EndpointSlice makes
  # it reachable from the Cilium Gateway API by the stable DNS name
  # e2b-server.%{SANDBOX_NAMESPACE}%.svc. The EndpointSlice address points at the
  # host's advertise IP (--advertise-address, default node-ip) on the e2b
  # listen port — substituted at stage time and never loopback.
  clusterIP: None
  ports:
  - name: http
    port: 3676
    protocol: TCP
# e2b-server keeps its staged EndpointSlice: it is a single host-process
# service (embedded e2b in the k8e-server process), unlike the gRPC gateway
# which HA-deploys on every server node.
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: e2b-server
  namespace: %{SANDBOX_NAMESPACE}%
  labels:
    kubernetes.io/service-name: e2b-server
    endpointslice.kubernetes.io/managed-by: k8e
    app.kubernetes.io/managed-by: k8e
addressType: IPv4
endpoints:
- addresses:
  - "%{ADVERTISE_IP}%"
  conditions:
    ready: true
ports:
- name: http
  port: 3676
  protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: sandbox-gateway
  labels:
    app.kubernetes.io/managed-by: k8e
spec:
  # Exactly the host private IP: Cilium LB-IPAM only assigns Gateway
  # spec.addresses that fall inside a pool CIDR — without this /32 block the
  # generated cilium-gateway-e2b Service stays <pending> and the Gateway
  # never reaches Programmed=True (bare-metal one-click expose, KIP-24).
  blocks:
  - cidr: "%{ADVERTISE_IP}%/32"
  # Scope strictly to the e2b Gateway's own LoadBalancer Service.
  serviceSelector:
    matchLabels:
      io.cilium.gateway/owning-gateway: e2b
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: e2b
  annotations:
    # Optional: parametersRef to a CiliumGatewayClassConfig for host-network
    # mode. Defaults to LoadBalancer-backed listeners.
    gatewayclass.kubernetes.io/controller-name: io.cilium/gateway-controller
spec:
  controllerName: io.cilium/gateway-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: e2b
  namespace: %{SANDBOX_NAMESPACE}%
  labels:
    app.kubernetes.io/managed-by: k8e
spec:
  gatewayClassName: e2b
  # Pin the LoadBalancer IP to the host's private IP (same value as the
  # EndpointSlice addresses below): Cilium's gateway controller assigns
  # spec.addresses to the generated LoadBalancer Service, so the Gateway is
  # reachable one-click on bare metal / single-host installs — no MetalLB,
  # no <pending> external-IP. Resolved at stage time from --advertise-address
  # (default node-ip), never loopback (KIP-21).
  addresses:
  - type: IPAddress
    value: "%{ADVERTISE_IP}%"
  listeners:
  - name: http
    port: 80
    protocol: HTTP
    allowedRoutes:
      namespaces:
        from: Same
  # TLS listener for https apiUrl: OPTIONAL. Provide a tls secret named
  # sandbox-e2b (kubectl -n %{SANDBOX_NAMESPACE}% create secret tls sandbox-e2b
  # --cert=... --key=...); without the secret this listener reports Invalid,
  # which does not affect the :80 http listener or attached routes.
  - name: https
    port: 443
    protocol: HTTPS
    tls:
      certificateRefs:
      - name: sandbox-e2b
    allowedRoutes:
      namespaces:
        from: Same
  # L4 passthrough for the sandbox gRPC gateway :50051. The gateway speaks
  # strong mTLS (client certs signed by the sandbox CA, verified by
  # mTLSAuthInterceptor), so we cannot terminate TLS here — a TCPRoute
  # forwards the byte stream unchanged and the existing client certificates
  # keep working. Backend is the headless sandbox-grpc-gateway Service +
  # Endpoints pointing at the host-resident k8e-server process.
  - name: grpc
    port: 50051
    protocol: TCP
    allowedRoutes:
      kinds:
      - kind: TCPRoute
      namespaces:
        from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: TCPRoute
metadata:
  name: sandbox-grpc
  namespace: %{SANDBOX_NAMESPACE}%
  labels:
    app.kubernetes.io/managed-by: k8e
spec:
  parentRefs:
  - name: e2b
    sectionName: grpc
  rules:
  - backendRefs:
    - name: sandbox-grpc-gateway
      port: 50051
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: e2b-control-plane
  namespace: %{SANDBOX_NAMESPACE}%
  labels:
    app.kubernetes.io/managed-by: k8e
spec:
  # sectionName: http — attach ONLY to the :80 listener. The :443 listener
  # stays Invalid until the optional sandbox-e2b TLS secret is created, and
  # an unqualified parentRef would be rejected by that listener
  # (NotAllowedByListeners), taking the whole route down with it.
  parentRefs:
  - name: e2b
    sectionName: http
  rules:
  # Control plane (root-mounted): /sandboxes, /v2/sandboxes, /health, /files.
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: e2b-server
      port: 3676
---
# The same control plane over TLS, as its OWN route object.
#
# The :443 listener needs a TLS secret (sandbox-e2b); without it the
# listener reports Invalid and any route attached to it is rejected with
# NotAllowedByListeners. Keeping the HTTPS route separate from the HTTP
# one is what makes that safe: a rejected attachment fails only this route,
# while the :80 route keeps serving. A single route with two parentRefs
# would take the HTTP path down with it.
#
# With the secret present, the E2B surface is reachable over HTTPS:
#   apiUrl     = https://<gateway>/           (control plane)
#   sandboxUrl = https://<gateway>/e2b/envd   (envd data plane)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: e2b-control-plane-tls
  namespace: %{SANDBOX_NAMESPACE}%
  labels:
    app.kubernetes.io/managed-by: k8e
spec:
  parentRefs:
  - name: e2b
    sectionName: https
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: e2b-server
      port: 3676
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: e2b-envd
  namespace: %{SANDBOX_NAMESPACE}%
  labels:
    app.kubernetes.io/managed-by: k8e
spec:
  # sectionName: http — attach ONLY to the :80 listener, same reasoning as
  # e2b-control-plane above: an unqualified parentRef would also try to attach
  # to the :443 listener (Invalid until the sandbox-e2b TLS secret exists) and
  # to the :50051 TCP listener (HTTPRoute is not an allowed kind there).
  parentRefs:
  - name: e2b
    sectionName: http
  rules:
  # envd surface + signed files: /e2b/envd, /e2b/api (alias), /files.
  - matches:
    - path:
        type: PathPrefix
        value: /e2b
    - path:
        type: PathPrefix
        value: /files
    timeouts:
      # The envd surface carries long-lived Connect/WebSocket streams (exec,
      # file watch, process control). Envoy's default request timeout would
      # kill those sessions mid-stream; 0s explicitly disables it.
      request: 0s
    backendRefs:
    - name: e2b-server
      port: 3676
---
# The envd surface over TLS, as its OWN route object — see the reasoning on
# e2b-control-plane-tls above for why this is not a second parentRef.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: e2b-envd-tls
  namespace: %{SANDBOX_NAMESPACE}%
  labels:
    app.kubernetes.io/managed-by: k8e
spec:
  parentRefs:
  - name: e2b
    sectionName: https
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /e2b
    - path:
        type: PathPrefix
        value: /files
    timeouts:
      request: 0s
    backendRefs:
    - name: e2b-server
      port: 3676
