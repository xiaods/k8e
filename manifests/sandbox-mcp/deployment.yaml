apiVersion: v1
kind: Namespace
metadata:
  name: k8e-mcp
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8e-mcp
  namespace: k8e-mcp
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mcp-state
  namespace: k8e-mcp
rules:
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, create, update]
  # The enrolled gateway identity (KIP-30 M2): ca.crt/tls.crt/tls.key in one
  # ConfigMap, written by mcp-serve itself at startup. Listed explicitly so the
  # dependency survives any future narrowing of the rule above.
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [mcp-client-cert]
    verbs: [get, create, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mcp-state
  namespace: k8e-mcp
subjects:
  - kind: ServiceAccount
    name: k8e-mcp
    namespace: k8e-mcp
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mcp-state
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mcp-api-key-reader
  namespace: sandbox-matrix
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [sandbox-apikeys]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mcp-api-key-reader
  namespace: sandbox-matrix
subjects:
  - kind: ServiceAccount
    name: k8e-mcp
    namespace: k8e-mcp
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mcp-api-key-reader
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8e-mcp
  namespace: k8e-mcp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: k8e-mcp
  template:
    metadata:
      labels:
        app: k8e-mcp
    spec:
      serviceAccountName: k8e-mcp
      terminationGracePeriodSeconds: 45
      # A small install runs everything on control-plane nodes. K8E does not
      # taint them by default, but an operator that does (or runs a dedicated
      # control plane) should not lose MCP scheduling.
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp
          # Published by the release workflow (see .github/workflows/release.yml
          # build-mcp-image). Source builds override at init time with
          # `bash hack/init-sandbox-mcp.sh ... --image k8e-mcp:local`.
          # imagePullPolicy is deliberately unset: kubelet defaults to Always
          # for :latest (so a new release image is actually pulled) and
          # IfNotPresent for a versioned or locally imported tag (air-gap).
          image: ghcr.io/xiaods/k8e-mcp:latest
          command: [/usr/local/bin/k8e-sandbox-cli]
          args:
            - mcp-serve
            - --listen=:8080
            - --gateway=sandbox-grpc-gateway.sandbox-matrix.svc:50051
            # Trust anchor for the first Login handshake: the sandbox CA
            # (non-secret; a CA exists to be distributed). Mounted read-only
            # from the mcp-bootstrap Secret created by
            # hack/init-sandbox-mcp.sh. Once one Login has succeeded, the CA
            # is cached in the identity ConfigMap and this file is only
            # consulted again on re-enrollment.
            - --gateway-ca=/bootstrap/ca.crt
            - --api-key-namespace=sandbox-matrix
            - --api-key-secret=sandbox-apikeys
            - --state-namespace=k8e-mcp
          env:
            # K8E_MCP_BOOTSTRAP_API_KEY (KIP-30 M2): at startup mcp-serve
            # enrolls its own gateway client certificate from this key —
            # one Login per cold identity, cached in ConfigMap
            # k8e-mcp/mcp-client-cert so restarts and rollouts keep one
            # identity until its 90-day TTL nears. A Secret ref, never a
            # literal: reading the pod env equals reading the key.
            - name: K8E_MCP_BOOTSTRAP_API_KEY
              valueFrom:
                secretKeyRef:
                  name: mcp-bootstrap
                  key: apikey
                  optional: false
            # K8E_MCP_TENANT scopes every session this instance creates to one
            # tenant (isolation boundary). Empty keeps the pre-M2 behavior —
            # sessions land in the server-side shared "default" bucket, which
            # is single-tenant only. One Deployment per tenant for more.
            - name: K8E_MCP_TENANT
              value: ""
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
              ephemeral-storage: 16Mi
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            tcpSocket:
              port: http
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              scheme: HTTP
              port: http
              path: /readyz
            timeoutSeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
          volumeMounts:
            - name: bootstrap
              mountPath: /bootstrap
              readOnly: true
      volumes:
        # mcp-bootstrap carries the sandbox CA (ca.crt) and one API key
        # (apikey); created by hack/init-sandbox-mcp.sh from the server's
        # /var/lib/k8e/server/tls/sandbox-ca.crt and an existing key in
        # sandbox-matrix/sandbox-apikeys.
        - name: bootstrap
          secret:
            secretName: mcp-bootstrap
---
apiVersion: v1
kind: Service
metadata:
  name: k8e-mcp
  namespace: k8e-mcp
  labels:
    app.kubernetes.io/managed-by: k8e
spec:
  selector:
    app: k8e-mcp
  ports:
    - name: http
      port: 80
      targetPort: http
      appProtocol: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: ReferenceGrant
metadata:
  name: sandbox-gateway-to-mcp
  namespace: k8e-mcp
  labels:
    app.kubernetes.io/managed-by: k8e
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: sandbox-matrix
  to:
    - group: ""
      kind: Service
      name: k8e-mcp
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: k8e-mcp
  namespace: sandbox-matrix
  labels:
    app.kubernetes.io/managed-by: k8e
spec:
  parentRefs:
    - name: e2b
      sectionName: https
    - name: e2b
      # Fallback for installs without the sandbox-e2b TLS Secret: the https
      # listener reports Invalid there, which would make this route
      # NotAllowedByListeners. Attaching to http too keeps /mcp reachable on
      # a plain-HTTP install; point clients at https once sandbox-e2b exists.
      sectionName: http
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /mcp
      timeouts:
        request: 45s
      backendRefs:
        - name: k8e-mcp
          namespace: k8e-mcp
          port: 80
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: k8e-mcp
  namespace: k8e-mcp
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: k8e-mcp
